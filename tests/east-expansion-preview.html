<!doctype html><html lang="vi"><meta charset="utf-8"><title>Khám phá tuyến vòng ven sông</title>
<style>body{margin:0;background:#14281f;color:#eee;font:13px system-ui}header{display:flex;gap:8px;padding:8px}button{padding:8px}#result{white-space:pre-line;padding:8px}iframe{width:1200px;height:720px;border:0}</style>
<header><button id="river">Sân ngắm sông</button><button id="market">Chợ phiên</button><button id="tea">Quán vườn tre</button><button id="run">Thử bộ ảnh, xe và lưu vị trí</button><button id="fps">Đo ba mẫu khung hình</button><button id="hide">Ẩn hiện HUD</button><button id="restore" disabled>Khôi phục save</button></header><div id="result">Origin riêng 127.0.0.1</div><iframe title="Khu phía Đông"></iframe>
<script type="module">
import {EAST_PLACES}from'../district-routes.mjs';import {SAVE_KEY,encodeSnapshot,parseSnapshot}from'../gameplay-state.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),keys=[SAVE_KEY,'phu_thuong_story_revision','phu_thuong_game_settings_v3'];let backup;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument,diag=()=>doc()?.querySelector('#interact-prompt');
const busy=value=>{for(const id of ['river','market','tea','run','fps','hide'])document.querySelector('#'+id).disabled=value;};
const fire=(code,type)=>frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent(type,{code,bubbles:true})),tap=code=>{fire(code,'keydown');fire(code,'keyup');};
const check=(ok,label)=>{if(!ok)throw Error(label);result.textContent+='✓ '+label+'\n';};
async function ready(){const until=performance.now()+45000;while(!diag()?.dataset.charactersReady){if(performance.now()>until)throw Error('Game chưa sẵn sàng');await wait(100);}await wait(300);}
async function load(p,snapshot={coins:50000,day:1}){if(location.hostname!=='127.0.0.1')throw Error('Dùng 127.0.0.1');backup??=keys.map(k=>[k,localStorage.getItem(k)]);document.querySelector('#restore').disabled=false;frame.src='about:blank';await wait(300);localStorage.setItem(SAVE_KEY,encodeSnapshot({...snapshot,playerPosition:{x:p.x,z:p.z},camYaw:Math.atan2(p.lookX-p.x,p.lookZ-p.z)}));localStorage.setItem(keys[1],'2');localStorage.setItem(keys[2],JSON.stringify({preset:'medium',camMode:'fps',autoTurnHead:false,brightness:1,showWaypoints:false}));frame.src='../index.html?playtest=1';await ready();}
for(const [id,index]of [['river',1],['market',2],['tea',0]])document.querySelector('#'+id).onclick=async()=>{busy(true);try{const p=EAST_PLACES[index];await load(id==='market'?{...p,x:298,z:-88}:p);result.textContent='Đã tới '+p.name;}catch(e){result.textContent='FAIL '+e.message;}finally{busy(false);}};
document.querySelector('#run').onclick=async()=>{busy(true);try{
 result.textContent='';let snapshot={coins:50000,day:1};
 for(const p of EAST_PLACES){await load(p,snapshot);tap('KeyP');await wait(1000);snapshot=parseSnapshot(localStorage.getItem(SAVE_KEY));check(snapshot.daylife.east.visited.includes(p.id),'P ghi ảnh đúng góc: '+p.name);check(Math.abs(snapshot.playerPosition.x-p.x)<2,'Save giữ tọa độ mới x='+p.x);const n=snapshot.daylife.east.visited.length;tap('KeyP');await wait(700);check(parseSnapshot(localStorage.getItem(SAVE_KEY)).daylife.east.visited.length===n,'Không nhân đôi dấu khám phá');}
 doc().querySelector('#daylife-button').click();const button=[...doc().querySelectorAll('#daylife-modal button')].find(b=>b.textContent.includes('Khám phá khu ven sông'));button.click();const claim=[...doc().querySelectorAll('#daylife-modal button')].find(b=>b.textContent.startsWith('Nộp bộ ảnh'));check(!claim.disabled,'Đủ ba địa điểm mở phần thưởng');claim.click();await wait(1000);snapshot=parseSnapshot(localStorage.getItem(SAVE_KEY));check(snapshot.daylife.east.claimed&&snapshot.daylife.points===1,'Nhận thưởng bộ ảnh đúng một lần');
 tap('Escape');await load(EAST_PLACES[1],snapshot);check(parseSnapshot(localStorage.getItem(SAVE_KEY)).daylife.east.claimed,'Tải lại giữ bộ ảnh đã nộp');tap('KeyF');await wait(250);check(JSON.parse(diag().dataset.rideState).riding,'Lên xe được ở khu mới');tap('KeyF');await wait(250);check(!JSON.parse(diag().dataset.rideState).riding,'Xuống xe được ở sân ven sông');
 await load({x:350,z:-130,lookX:350,lookZ:-160},snapshot);const before=diag().dataset.playerPosition.split(',').map(Number);tap('KeyF');fire('KeyW','keydown');await wait(900);fire('KeyW','keyup');fire('Space','keydown');await wait(1000);fire('Space','keyup');const after=diag().dataset.playerPosition.split(',').map(Number);check(Math.hypot(after[0]-before[0],after[1]-before[1])>1,'Lái xe thật trên đoạn đường mới, không mắc collider');tap('KeyF');await load(EAST_PLACES[1],snapshot);
 result.textContent+='PASS · ba điểm, chụp ảnh, chống lặp, nhận thưởng, save/reload và lái xe\n';
 }catch(e){result.textContent+='FAIL '+e.message;}finally{busy(false);}};
document.querySelector('#fps').onclick=async()=>{busy(true);try{const rows=[];let at=0;const until=performance.now()+22000;while(rows.length<3){if(performance.now()>until)throw Error('Hết thời gian đo');const raw=diag()?.dataset.performance;if(raw){const r=JSON.parse(raw);if(r.at!==at){rows.push(r);at=r.at;}}await wait(100);}result.textContent+='\nBENCHMARK '+JSON.stringify(rows);}catch(e){result.textContent+='FAIL '+e.message;}finally{busy(false);}};
document.querySelector('#hide').onclick=()=>{const d=doc();let style=d.querySelector('#east-review');if(style){style.remove();return;}style=d.createElement('style');style.id='east-review';style.textContent='#game-hud-top,#inventory-bar,#community-card,#controls-bar,#character-status,#minimap-container,#daylife-button,#daylife-tracker,#arcade-guide,#district-guide,#street-event-banner,#toast,#pointer-lock-hint,#interact-prompt{display:none!important}';d.head.append(style);};
document.querySelector('#restore').onclick=async()=>{frame.src='about:blank';await wait(400);backup?.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));result.textContent+='Đã khôi phục save';};
</script></html>
