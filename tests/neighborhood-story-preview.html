<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra chuyện khu phố</title>
<style>body{margin:0;background:#15251f;color:#eee;font:14px system-ui}header{display:flex;gap:10px;padding:10px}button{padding:9px}iframe{width:1200px;height:700px;border:0}#result{white-space:pre-line;padding:8px}</style>
<header><button id="load">Chuẩn bị phiên kiểm tra</button><button id="run" disabled>Hoàn thành việc và chọn kết thúc</button><button id="view" disabled>Xem công trình trong ngõ</button><button id="restore" disabled>Khôi phục save</button></header><div id="result">Chỉ dùng origin 127.0.0.1.</div><iframe title="Chuyện Ngõ 41"></iframe>
<script type="module">
import {SAVE_KEY,encodeSnapshot,parseSnapshot} from '../gameplay-state.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
const keys=[SAVE_KEY,'phu_thuong_story_revision','phu_thuong_game_settings_v3'];let backup;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument;
const key=code=>{for(const type of ['keydown','keyup'])frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent(type,{code,bubbles:true}));};
async function ready(){const until=performance.now()+45000;while(!doc()?.querySelector('#interact-prompt')?.dataset.charactersReady){if(performance.now()>until)throw Error('Game chưa sẵn sàng');await wait(100);}}
const click=text=>{const button=[...doc().querySelectorAll('#daylife-modal button')].find(b=>b.textContent.startsWith(text));if(!button)throw Error('Thiếu '+text);button.click();};
const check=(value,text)=>{if(!value)throw Error(text);result.textContent+='✓ '+text+'\n';};
document.querySelector('#load').onclick=async()=>{try{
 if(location.hostname!=='127.0.0.1')throw Error('Dùng origin 127.0.0.1');
 backup??=keys.map(k=>[k,localStorage.getItem(k)]);document.querySelector('#restore').disabled=false;
 localStorage.setItem(SAVE_KEY,encodeSnapshot({day:2,coins:50000,playerPosition:{x:-52.5,z:-5.6},daylife:{day:2,story:{helped:['album','courier']},active:{id:'cleanup',done:['litter0','litter1','litter2'],quality:100,remaining:110}}}));
 localStorage.setItem(keys[1],'2');localStorage.setItem(keys[2],JSON.stringify({preset:'medium',camMode:'fps',showWaypoints:false,brightness:1}));
 frame.src='../index.html?playtest=1';await ready();document.querySelector('#run').disabled=false;document.querySelector('#load').disabled=true;result.textContent='Sẵn sàng · hai nhóm đã được giúp, còn ca phân loại cuối.\n';
 }catch(e){result.textContent+='FAIL '+e.message;}};
document.querySelector('#run').onclick=async()=>{try{
 document.querySelector('#run').disabled=true;key('KeyE');await wait(100);
 check(doc().querySelector('#daylife-title').textContent.includes('Phân loại'),'E mở hành động ngoài phố');
 click('Còn lại');click('Tái chế');click('Hữu cơ');click('Giữ đủ thù lao');key('KeyN');
 check(doc().querySelector('.neighborhood-story').textContent.includes('Dùng góc ngõ vào việc gì'),'Giúp đủ ba nhóm mở lựa chọn kết thúc');
 click('Góp vật liệu làm Góc xanh');check(doc().querySelector('.neighborhood-story').textContent.includes('Một góc ngõ có người chăm'),'Lời kết phản ánh lựa chọn');
 check(![...doc().querySelectorAll('button')].some(b=>b.textContent.startsWith('Góp vật liệu')),'Không thể nhận kết thúc lần hai');
 key('Escape');await wait(700);const saved=parseSnapshot(localStorage.getItem(SAVE_KEY));
 check(saved.daylife.story.ending==='green'&&saved.daylife.projects.green===1,'Lựa chọn và công trình được lưu thật');
 frame.contentWindow.location.reload();await ready();if(doc().querySelector('#daylife-modal').hidden)doc().querySelector('#daylife-button').click();
 check(!doc().querySelector('#daylife-modal').hidden&&doc().querySelector('.neighborhood-story').textContent.includes('Mấy chậu cây đã có chỗ'),'Tải lại giữ lời kết và tiến độ');
 document.querySelector('#view').disabled=false;result.textContent+='PASS · hoàn thành việc → lựa chọn → công trình → save/reload\n';
 }catch(e){result.textContent+='FAIL '+e.message;}};
document.querySelector('#view').onclick=async()=>{const saved=parseSnapshot(localStorage.getItem(SAVE_KEY));frame.src='about:blank';await wait(200);saved.playerPosition={x:-67,z:-12};saved.camYaw=Math.PI;localStorage.setItem(SAVE_KEY,encodeSnapshot(saved));frame.src='../index.html?playtest=1';await ready();};
document.querySelector('#restore').onclick=async()=>{frame.src='about:blank';await wait(250);backup?.forEach(([key,value])=>value===null?localStorage.removeItem(key):localStorage.setItem(key,value));result.textContent+='Đã khôi phục save';};
</script></html>
