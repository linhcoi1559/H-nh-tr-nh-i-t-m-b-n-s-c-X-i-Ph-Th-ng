<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kiểm tra Tấm ảnh trước cửa</title>
<style>body{margin:0;background:#13271f;color:#eee;font:13px system-ui}header{display:flex;gap:8px;padding:8px}button{padding:9px}#result{white-space:pre-line;padding:8px}iframe{width:1200px;height:720px;border:0}</style>
<header><button id="run">Thử toàn bộ tuyến điều tra</button><button id="board" disabled>Mở sổ và lời kết</button><button id="view" disabled>Xem bảng trong ngõ</button><button id="restore" disabled>Khôi phục save</button></header><div id="result">Chỉ dùng 127.0.0.1 · không thay save localhost.</div><iframe title="Tấm ảnh trước cửa"></iframe>
<script type="module">
import {SAVE_KEY,encodeSnapshot,parseSnapshot}from'../gameplay-state.mjs';
const frame=document.querySelector('iframe'),result=document.querySelector('#result'),keys=[SAVE_KEY,'phu_thuong_story_revision','phu_thuong_game_settings_v3'];let backup;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),doc=()=>frame.contentDocument;
const tap=code=>{for(const type of ['keydown','keyup'])frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent(type,{code,bubbles:true}));};
const check=(ok,label)=>{if(!ok)throw Error(label);result.textContent+='✓ '+label+'\n';};
async function load(snapshot){frame.src='about:blank';await wait(250);localStorage.setItem(SAVE_KEY,encodeSnapshot(snapshot));localStorage.setItem(keys[1],'2');localStorage.setItem(keys[2],JSON.stringify({preset:'medium',camMode:'fps',brightness:1,showWaypoints:false}));frame.src='../index.html?playtest=1';const until=performance.now()+45000;while(!doc()?.querySelector('#interact-prompt')?.dataset.charactersReady){if(performance.now()>until)throw Error('Game chưa sẵn sàng');await wait(100);}await wait(250);}
const click=prefix=>{const b=[...doc().querySelectorAll('#daylife-modal button')].find(b=>b.textContent.startsWith(prefix));if(!b||b.disabled)throw Error('Thiếu nút khả dụng: '+prefix);b.click();};
const board=()=>doc().querySelector('#daylife-button').click();
async function saved(){await wait(900);return parseSnapshot(localStorage.getItem(SAVE_KEY));}
async function stopAt(snapshot,x,z){snapshot.playerPosition={x,z};await load(snapshot);tap('KeyE');await wait(100);}
document.querySelector('#run').onclick=async()=>{try{
 if(location.hostname!=='127.0.0.1')throw Error('Dùng origin 127.0.0.1');backup??=keys.map(k=>[k,localStorage.getItem(k)]);document.querySelector('#restore').disabled=false;document.querySelector('#run').disabled=true;result.textContent='';
 let snapshot={coins:50000,day:1,playerPosition:{x:4,z:2}};await load(snapshot);board();click('Nhận lời tìm người trong ảnh');snapshot=await saved();check(snapshot.daylife.mystery.started,'Nhận lời từ bảng N và lưu trạng thái');
 board();click('Tạm gác điều tra');snapshot=await saved();check(snapshot.daylife.mystery.suspended,'Có thể tạm gác mà không mất sổ');board();click('Tiếp tục điều tra');snapshot=await saved();
 await stopAt(snapshot,-75.65,-109);check(doc().querySelector('#daylife-title').textContent.includes('bác Sơn'),'E ở hiệu sách mở lời nhờ');click('Ghi nhận tấm ảnh');snapshot=await saved();check(snapshot.daylife.mystery.clues.includes('back'),'Mặt sau ảnh được ghi trong save');
 await stopAt(snapshot,26.35,-221.5);click('Ghi lời kể vào sổ');snapshot=await saved();check(snapshot.daylife.mystery.clues.includes('water'),'Hỏi chú Bình trước cũng được');
 await stopAt(snapshot,47.85,-95.5);click('Ghi lời kể vào sổ');snapshot=await saved();check(snapshot.daylife.mystery.clues.length===3,'Ba manh mối qua các lần reload');
 board();click('Mở sổ manh mối');click('Một học sinh');check(doc().querySelector('#daylife-content').textContent.includes('Số 41 chưa đủ'),'Kết luận sai có giải thích và được sửa');
 click('Bà Mai, người thợ may');snapshot=await saved();check(snapshot.daylife.mystery.deduced,'Đối chiếu đúng mở bước xin ý kiến');
 tap('KeyF');await wait(250);tap('KeyE');check(doc().querySelector('#daylife-modal').hidden,'Đang ngồi xe không hỏi cư dân');tap('KeyF');await wait(250);
 // Reload known safe foot position after dismount, preserving all actual quest progress.
 await stopAt(snapshot,47.85,-95.5);click('Ghi lại mong muốn');snapshot=await saved();check(snapshot.daylife.mystery.consent,'Ghi ý kiến gia đình trước kết thúc');
 await stopAt(snapshot,-52.5,-5);check(doc().querySelector('#daylife-title').textContent.includes('chọn cách'),'Quay về cô Hoa mới chọn kết thúc');const beforeEnding=await saved();click('Chỉ kể về nghề');snapshot=await saved();
 check(snapshot.daylife.mystery.ending==='anonymous'&&snapshot.xp-beforeEnding.xp===150&&snapshot.daylife.points-beforeEnding.daylife.points===2,'Kết thúc cộng đúng XP/điểm một lần');
 await load(snapshot);board();check(doc().querySelector('.mystery-story').textContent.includes('Không ghi tên gia đình'),'Reload giữ đúng hậu quả');check(![...doc().querySelectorAll('#daylife-modal button')].some(b=>b.textContent.startsWith('Nhận lời tìm người')),'Không thể nhận lại cùng chương');
 document.querySelector('#board').disabled=false;document.querySelector('#view').disabled=false;result.textContent+='PASS · nhận lời, tạm gác, ba điểm, suy luận sai/đúng, xe, xin ý kiến, kết thúc, save/reload\n';
 }catch(e){result.textContent+='FAIL '+e.message;}};
document.querySelector('#board').onclick=()=>{if(doc().querySelector('#daylife-modal').hidden)board();};
document.querySelector('#view').onclick=async()=>{const snapshot=await saved();snapshot.camYaw=Math.PI/2;await load({...snapshot,playerPosition:{x:-66.5,z:-30.4}});};
document.querySelector('#restore').onclick=async()=>{frame.src='about:blank';await wait(300);backup?.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));result.textContent+='Đã khôi phục save';};
</script></html>
